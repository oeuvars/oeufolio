<!doctype html>
<meta charset="utf-8" />
<title>plate</title>
<!--
  The words on the card that differ from the reference, set in the card's own places.
  Coordinates are the card's pixels in the reference (415 x 655). Captured at 830 x 1310 CSS pixels,
  2x, into studio/assets/overlay.png: black is ink, white is bare card. studio/badge.py prints it
  onto the reference photograph where the old words were.
-->
<style>
  @font-face {
    font-family: 'Mono';
    src: url('/node_modules/@fontsource/sometype-mono/files/sometype-mono-latin-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Hand';
    src: url('/node_modules/@fontsource/gloria-hallelujah/files/gloria-hallelujah-latin-400-normal.woff2') format('woff2');
  }
  html, body { margin: 0; background: #fff; }
  svg { display: block; }
  .mono { font-family: 'Mono', monospace; fill: #000; }
  .hand { font-family: 'Hand', cursive; fill: #000; stroke: #000; stroke-width: 0.95; stroke-linecap: round; stroke-linejoin: round; }
  .bold { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; }
</style>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 655" width="830" height="1310">
  <defs>
    <filter id="scribble" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.22" numOctaves="3" seed="11" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <text class="mono" x="294" y="58" font-size="17.5" textLength="55.5" lengthAdjust="spacingAndGlyphs">DROP:25</text>

  <text class="mono" x="33" y="156.7" font-size="17.1" textLength="226">PRODUCT-FIRST ENGINEER</text>
  <g filter="url(#scribble)">
    <rect x="275" y="141.5" width="66" height="18.5" rx="3" fill="#000" />
    <rect x="268" y="150" width="14" height="6" fill="#000" />
    <rect x="334" y="152" width="13" height="5" fill="#000" />
    <rect x="300" y="138" width="22" height="6" fill="#000" />
  </g>
  <text class="bold" x="279" y="156.4" font-size="20.5" fill="#fff">cyber</text>
  <text class="bold" x="349" y="156.7" font-size="20.5" fill="#000">ship</text>

  <g stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="5.2 4.1">
    <line x1="35" y1="461" x2="393" y2="461" />
    <line x1="35" y1="516.7" x2="393" y2="516.7" />
    <line x1="35" y1="572.7" x2="393" y2="572.7" />
  </g>

  <!-- rotate and dy move each letter a little, so no two of the same letter sit alike -->
  <text class="hand" font-size="34.5" letter-spacing="1.3" rotate="-4 3 -2 5 -3 2 0 4 -5 3" dy="0 1.5 -1 0.5 -1.5 1 0 -1 1.5 -0.5" transform="translate(102 450) rotate(-1.4) scale(1 1.2)">Anurag Das</text>
  <text class="hand" font-size="34.5" letter-spacing="1.3" rotate="3 -4 2 -3 5 -2 4 -3" dy="0 -1 1.5 -0.5 1 -1.5 0.5 1" transform="translate(146 506) rotate(0.9) scale(1 1.2)">Engineer</text>
  <text class="hand" font-size="34.5" letter-spacing="1.3" rotate="-3 4 0 -5 3 -2 4" dy="0 1 0 -1.5 1 0.5 -1" transform="translate(96 563) rotate(-0.6) scale(1 1.2)">T3 Warm</text>
</svg>
