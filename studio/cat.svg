<!--
  The cat's own mark for the last tab: a Turkish Van asleep on her back, stretched out as far as she goes.
  White, with the breed's auburn on her head and her tail. Captured into studio/assets/cat.png by a
  headless Chromium with a clear default background (00000000), a window of 300 x 712 and four device
  pixels to one of these. studio/tabs.py prints it on a piece of plastic of her own.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -6 300 712" width="300" height="712">
  <defs>
    <clipPath id="on-head">
      <path d="M80 140 L 66 70 L 122 112 Z" />
      <path d="M184 140 L 198 70 L 142 112 Z" />
      <ellipse cx="132" cy="168" rx="66" ry="58" />
    </clipPath>
    <clipPath id="on-tail">
      <path d="M150 548 C 212 548 250 590 236 652" fill="none" stroke="#000" stroke-width="30" stroke-linecap="round" />
    </clipPath>
  </defs>

  <!-- the white border the sticker is cut with -->
  <g fill="#fbf8f1" stroke="#fbf8f1" stroke-linejoin="round">
    <path d="M150 548 C 212 548 250 590 236 652" fill="none" stroke-width="72" stroke-linecap="round" />
    <path d="M102 520 C 98 570 96 600 94 636" fill="none" stroke-width="88" stroke-linecap="round" />
    <path d="M162 520 C 164 560 164 585 162 612" fill="none" stroke-width="88" stroke-linecap="round" />
    <path d="M84 240 C 60 190 44 140 40 80" fill="none" stroke-width="84" stroke-linecap="round" />
    <path d="M180 240 C 204 195 218 150 222 104" fill="none" stroke-width="84" stroke-linecap="round" />
    <path d="M132 200 C 192 200 202 254 202 334 C 202 424 206 474 192 524 C 178 564 86 564 72 524 C 58 474 62 424 62 334 C 62 254 72 200 132 200 Z" stroke-width="42" />
    <g stroke-width="42">
      <path d="M80 140 L 66 70 L 122 112 Z" />
      <path d="M184 140 L 198 70 L 142 112 Z" />
      <ellipse cx="132" cy="168" rx="66" ry="58" />
    </g>
  </g>

  <!-- the tail: auburn, ringed darker, and it lies under her legs -->
    <path d="M150 548 C 212 548 250 590 236 652" fill="none" stroke="#2f1d14" stroke-width="42" stroke-linecap="round" />
    <path d="M150 548 C 212 548 250 590 236 652" fill="none" stroke="#c0683a" stroke-width="30" stroke-linecap="round" />
  <g clip-path="url(#on-tail)" stroke="#8a3f1e" stroke-width="10" fill="none">
    <path d="M186 528 L 176 572" />
    <path d="M222 540 L 198 580" />
    <path d="M252 572 L 214 598" />
    <path d="M258 618 L 218 624" />
  </g>

  <!-- legs and trunk: every outline first and then the coat, so she is one shape with no seams inside her -->
  <g stroke="#2f1d14" fill="#2f1d14" stroke-linejoin="round">
    <path d="M102 520 C 98 570 96 600 94 636" fill="none" stroke-width="58" stroke-linecap="round" />
    <path d="M162 520 C 164 560 164 585 162 612" fill="none" stroke-width="58" stroke-linecap="round" />
    <path d="M84 240 C 60 190 44 140 40 80" fill="none" stroke-width="54" stroke-linecap="round" />
    <path d="M180 240 C 204 195 218 150 222 104" fill="none" stroke-width="54" stroke-linecap="round" />
    <path d="M132 200 C 192 200 202 254 202 334 C 202 424 206 474 192 524 C 178 564 86 564 72 524 C 58 474 62 424 62 334 C 62 254 72 200 132 200 Z" stroke-width="12" />
  </g>
  <g stroke="#fffdf8" fill="#fffdf8">
    <path d="M102 520 C 98 570 96 600 94 636" fill="none" stroke-width="46" stroke-linecap="round" />
    <path d="M162 520 C 164 560 164 585 162 612" fill="none" stroke-width="46" stroke-linecap="round" />
    <path d="M84 240 C 60 190 44 140 40 80" fill="none" stroke-width="42" stroke-linecap="round" />
    <path d="M180 240 C 204 195 218 150 222 104" fill="none" stroke-width="42" stroke-linecap="round" />
    <path d="M132 200 C 192 200 202 254 202 334 C 202 424 206 474 192 524 C 178 564 86 564 72 524 C 58 474 62 424 62 334 C 62 254 72 200 132 200 Z" stroke="none" />
  </g>

  <!-- the belly's shade, and the fur ruffled down the middle of it -->
  <path fill="#f0e6d6" d="M132 262 C 166 262 174 310 174 366 C 174 436 168 484 132 496 C 96 484 90 436 90 366 C 90 310 98 262 132 262 Z" />
  <g fill="none" stroke="#2f1d14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <path d="M118 318 l 10 12 l 10 -12" />
    <path d="M138 388 l 10 12 l 10 -12" />
    <path d="M108 444 l 10 12 l 10 -12" />
  </g>

  <!-- pads and toes -->
  <g fill="#ee9d9a">
    <ellipse cx="41" cy="80" rx="10" ry="9" />
    <circle cx="27" cy="64" r="5" /><circle cx="39" cy="57" r="5" /><circle cx="52" cy="62" r="5" />
    <ellipse cx="222" cy="104" rx="10" ry="9" />
    <circle cx="209" cy="88" r="5" /><circle cx="222" cy="82" r="5" /><circle cx="235" cy="88" r="5" />
    <ellipse cx="94" cy="632" rx="11" ry="10" />
    <circle cx="80" cy="650" r="5" /><circle cx="94" cy="656" r="5" /><circle cx="108" cy="650" r="5" />
    <ellipse cx="162" cy="608" rx="11" ry="10" />
    <circle cx="148" cy="626" r="5" /><circle cx="162" cy="632" r="5" /><circle cx="176" cy="626" r="5" />
  </g>

  <!-- head, over her chest and her forelegs -->
  <g stroke="#2f1d14" fill="#2f1d14" stroke-width="12" stroke-linejoin="round">
    <path d="M80 140 L 66 70 L 122 112 Z" />
    <path d="M184 140 L 198 70 L 142 112 Z" />
    <ellipse cx="132" cy="168" rx="66" ry="58" />
  </g>
  <g fill="#fffdf8">
    <path d="M80 140 L 66 70 L 122 112 Z" />
    <path d="M184 140 L 198 70 L 142 112 Z" />
    <ellipse cx="132" cy="168" rx="66" ry="58" />
  </g>
  <g clip-path="url(#on-head)" fill="#c0683a">
    <path d="M50 60 L 124 60 C 124 100 118 132 106 150 C 92 160 70 156 56 140 Z" />
    <path d="M214 60 L 140 60 C 140 100 146 132 158 150 C 172 160 194 156 208 140 Z" />
  </g>
  <g fill="#f3bdb4">
    <path d="M86 128 L 78 92 L 106 113 Z" />
    <path d="M178 128 L 186 92 L 158 113 Z" />
  </g>
  <g fill="#f4aea6" opacity="0.7">
    <ellipse cx="88" cy="192" rx="13" ry="8" />
    <ellipse cx="176" cy="192" rx="13" ry="8" />
  </g>
  <g fill="none" stroke="#2f1d14" stroke-linecap="round" stroke-linejoin="round">
    <!-- eyes shut -->
    <path stroke-width="7" d="M92 172 q 15 14 30 0" />
    <path stroke-width="7" d="M142 172 q 15 14 30 0" />
    <!-- mouth -->
    <path stroke-width="5" d="M132 199 q -10 13 -20 3" />
    <path stroke-width="5" d="M132 199 q 10 13 20 3" />
  </g>
  <path fill="#e58783" stroke="#2f1d14" stroke-width="4" stroke-linejoin="round" d="M123 188 L 141 188 L 132 199 Z" />

</svg>
